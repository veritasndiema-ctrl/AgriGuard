name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # This repo's mobile/android and mobile/ios folders are placeholders
      # (only .gitkeep, no native project). `flutter create` regenerates the
      # missing platform scaffolding in place without touching lib/ or
      # pubspec.yaml. Safe to run every build; it's a no-op once the real
      # android/ project is committed to the repo.
      - name: Ensure Android platform project exists
        run: flutter create --platforms=android --org com.agriguard .

      - name: Get dependencies
        run: flutter pub get

      - name: Run analyzer (non-blocking)
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      - name: Build release APK
        run: flutter build apk --release --dart-define=AGRIGUARD_BACKEND_URL=${{ vars.AGRIGUARD_BACKEND_URL }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: agriguard-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Attach APK to a GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
