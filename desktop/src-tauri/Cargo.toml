[package]
name = "agriguard-desktop"
version = "0.1.0"
description = "AgriGuard desktop client — crop price forecasts & market intelligence"
authors = ["Keith Ndiema Kissa <veritasndiema@gmail.com>"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
