[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agriguard"
version = "0.2.0"
description = "Agricultural intelligence system for Uganda — crop price conveyance, crop price forecasting, market intelligence, and weather insights & forecasts"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "Keith Ndiema Kissa", email = "veritasndiema@gmail.com" },
]
keywords = [
    "agriculture",
    "price-forecasting",
    "xgboost",
    "prophet",
    "uganda",
    "food-security",
    "fastapi",
    "streamlit",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "joblib>=1.4",
    "httpx>=0.27",
    "requests>=2.32",
    "streamlit>=1.36",
    "plotly>=5.22",
]

[project.optional-dependencies]
ml = [
    "prophet>=1.1",
    "lightgbm>=4.3",
    "statsmodels>=0.14",
    "arch>=7.0",
    "mapie>=0.8",
    "scipy>=1.13",
]
db = [
    "alembic>=1.13",
    "aiomysql>=0.2",
    "PyMySQL>=1.1",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
all = ["agriguard[ml,db,dev]"]

[project.urls]
Homepage = "https://github.com/Agri-Guard/AgriGuard"
Repository = "https://github.com/Agri-Guard/AgriGuard"
Issues = "https://github.com/Agri-Guard/AgriGuard/issues"

[project.scripts]
agriguard-train = "scripts.train_models:main"
agriguard-validate = "scripts.validate_data:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "quant*", "ml*"]
exclude = ["tests*", "notebooks*", "frontend*", "mobile*", "desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests", "quant/tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
