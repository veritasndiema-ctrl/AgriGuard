name: agriguard_mobile
description: AgriGuard mobile client — crop price forecasts, market intelligence & alerts for Ugandan farmers.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0" # flutter_launcher_icons 0.14.x requires >=3.4.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.69.0
  http: ^1.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.5
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/data/agriguard_offline_data.json
    - assets/data/agriguard_weather_data.json

# Run `dart run flutter_launcher_icons` after `flutter pub get` to generate
# every mipmap/AppIcon size for Android + iOS from the source images below.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#1B5E20"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
